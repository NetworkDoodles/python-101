hostname r3
ip routing
!
interface Ethernet1
   description link to r1 Gi3
   no switchport
   ip address 10.0.13.2/30
!
interface Ethernet2
   description link to r2 Gi3
   no switchport
   ip address 10.0.23.2/30
!
interface Loopback0
   description router id
   ip address 10.255.0.3/32
!
ntp server 172.80.111.12
!
router ospf 1
   router-id 10.255.0.3
   network 10.0.0.0/16 area 0.0.0.0
   network 10.255.0.3/32 area 0.0.0.0
!
end
